# This is a Declarative Automation Bundle definition for my_job_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_job_bundle
  uuid: 4a0eb434-d6d1-4a71-b91a-bda8d97f5a07
# test 
include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-404769e6-c79b.cloud.databricks.com
    variables:
      catalog: cyntexa_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-404769e6-c79b.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bittuchudhare9118@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/bittuchudhare9118@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: cyntexa_dev
      schema: prod
    permissions:
      - user_name: bittuchudhare9118@gmail.com
        level: CAN_MANAGE
